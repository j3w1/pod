name: Pod checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  POD_REQUIRE_PTY: "1"
  DISABLE_TELEMETRY: "1"
  DO_NOT_TRACK: "1"

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install terminal and Python test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zsh
          PIN="$(PYTHONPATH=skills python -c 'from pod.installer import PIN; print(PIN)')"
          python -m pip install "$PIN" -r tests/requirements-pty.txt

      - name: Unit, incident, and installer subprocess suite
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: skills
      - name: Explicit incident discovery
        run: python -m unittest discover -s tests/incidents -t . -v
        env:
          PYTHONPATH: skills
      - name: Compile
        run: python -m compileall -q skills tests tools
      - name: Whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
      - name: Validate the skill bundle
        run: python -m pod.skill_validation skills/pod
        env:
          PYTHONPATH: skills
      - name: Validate the catalog
        run: python -m pod.catalog --check
        env:
          PYTHONPATH: skills
      - name: Tracked source hygiene audit
        run: python tools/source_audit.py .

      - name: Copied bundle works without the checkout
        run: |
          COPY="$RUNNER_TEMP/copy/pod"
          mkdir -p "$COPY" "$RUNNER_TEMP/elsewhere" "$RUNNER_TEMP/copy-home"
          cp -rL skills/pod/. "$COPY/"
          cd "$RUNNER_TEMP/elsewhere"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/copy-home" python -I "$COPY/scripts/pod.py" --version > version.txt
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/copy-home" python -I "$COPY/scripts/pod.py" config --json > config.json || test "$?" -eq 1
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/copy-home" python -I "$COPY/scripts/pod.py" doctor --json > doctor.json
          python - "$GITHUB_WORKSPACE/VERSION" <<'PY'
          import json, pathlib, sys
          assert pathlib.Path('version.txt').read_text().strip() == pathlib.Path(sys.argv[1]).read_text().strip()
          assert json.loads(pathlib.Path('config.json').read_text())['eligible'] == []
          assert json.loads(pathlib.Path('doctor.json').read_text())['installation'] == 'not installed by the one-shot installer'
          PY

      - name: Install this commit from an archive in a clean home
        run: |
          git archive --format=tar.gz --prefix=pod-source/ HEAD > "$RUNNER_TEMP/pod-source.tar.gz"
          SMOKE="$RUNNER_TEMP/install-home"
          mkdir -p "$SMOKE/home" "$SMOKE/claude" "$SMOKE/codex" "$SMOKE/work"
          export POD_INSTALL_SOURCE="file://$RUNNER_TEMP/pod-source.tar.gz"
          env -i PATH="$PATH" HOME="$SMOKE/home" XDG_DATA_HOME="$SMOKE/home/data" \
            XDG_STATE_HOME="$SMOKE/home/state" XDG_CONFIG_HOME="$SMOKE/home/config" \
            CLAUDE_CONFIG_DIR="$SMOKE/claude" CODEX_HOME="$SMOKE/codex" SHELL=/bin/bash \
            POD_INSTALL_SOURCE="$POD_INSTALL_SOURCE" sh install.sh
          test ! -e "$SMOKE/codex/skills/pod"
          test "$(readlink -f "$SMOKE/claude/skills/pod")" = "$(readlink -f "$SMOKE/home/.agents/skills/pod")"
          PYTHONPATH=skills python -m pod.skill_validation --installed "$SMOKE/home/.agents/skills/pod"
          env -i PATH="$PATH" HOME="$SMOKE/home" XDG_DATA_HOME="$SMOKE/home/data" \
            XDG_STATE_HOME="$SMOKE/home/state" XDG_CONFIG_HOME="$SMOKE/home/config" \
            CLAUDE_CONFIG_DIR="$SMOKE/claude" CODEX_HOME="$SMOKE/codex" \
            "$SMOKE/home/.local/bin/pod" --version | diff - VERSION
          env -i PATH="$PATH" HOME="$SMOKE/home" XDG_DATA_HOME="$SMOKE/home/data" \
            XDG_STATE_HOME="$SMOKE/home/state" XDG_CONFIG_HOME="$SMOKE/home/config" \
            CLAUDE_CONFIG_DIR="$SMOKE/claude" CODEX_HOME="$SMOKE/codex" \
            "$SMOKE/home/.local/bin/pod" config --json > "$RUNNER_TEMP/installed-config.json"
          env -i PATH="$PATH" HOME="$SMOKE/home" XDG_DATA_HOME="$SMOKE/home/data" \
            XDG_STATE_HOME="$SMOKE/home/state" XDG_CONFIG_HOME="$SMOKE/home/config" \
            CLAUDE_CONFIG_DIR="$SMOKE/claude" CODEX_HOME="$SMOKE/codex" \
            "$SMOKE/home/.local/bin/pod" doctor --json > "$RUNNER_TEMP/installed-doctor.json"
          python - "$RUNNER_TEMP/installed-doctor.json" "$RUNNER_TEMP/installed-config.json" "$SMOKE/home"/data/pod/install.json <<'PY'
          import json, pathlib, sys
          doctor = json.loads(pathlib.Path(sys.argv[1]).read_text())
          config = json.loads(pathlib.Path(sys.argv[2]).read_text())
          receipt = json.loads(pathlib.Path(sys.argv[3]).read_text())
          assert receipt['status'] == 'installed'
          assert len(config['eligible']) == 6
          assert doctor['installation_checks']['healthy']
          assert doctor['installation_checks']['digest_matches']
          PY
          env -i PATH="$PATH" HOME="$SMOKE/home" XDG_DATA_HOME="$SMOKE/home/data" \
            XDG_STATE_HOME="$SMOKE/home/state" XDG_CONFIG_HOME="$SMOKE/home/config" \
            CLAUDE_CONFIG_DIR="$SMOKE/claude" CODEX_HOME="$SMOKE/codex" SHELL=/bin/bash \
            POD_INSTALL_SOURCE="$POD_INSTALL_SOURCE" sh install.sh | grep 'Already current'
          env -i PATH="$PATH" HOME="$SMOKE/home" XDG_DATA_HOME="$SMOKE/home/data" \
            XDG_STATE_HOME="$SMOKE/home/state" XDG_CONFIG_HOME="$SMOKE/home/config" \
            CLAUDE_CONFIG_DIR="$SMOKE/claude" CODEX_HOME="$SMOKE/codex" SHELL=/bin/bash \
            POD_INSTALL_SOURCE="$POD_INSTALL_SOURCE" "$SMOKE/home/.local/bin/pod" update | grep 'Already current'

      - name: SHA-pinned public endpoints install this exact commit
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          SMOKE="$RUNNER_TEMP/public-home"
          mkdir -p "$SMOKE/home" "$SMOKE/claude" "$SMOKE/codex"
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/install.sh" | \
            env -i PATH="$PATH" HOME="$SMOKE/home" XDG_DATA_HOME="$SMOKE/home/data" \
              XDG_STATE_HOME="$SMOKE/home/state" XDG_CONFIG_HOME="$SMOKE/home/config" \
              CLAUDE_CONFIG_DIR="$SMOKE/claude" CODEX_HOME="$SMOKE/codex" SHELL=/bin/bash \
              POD_INSTALL_SOURCE="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}" sh
          test "$(env -i PATH="$PATH" HOME="$SMOKE/home" XDG_DATA_HOME="$SMOKE/home/data" \
            XDG_STATE_HOME="$SMOKE/home/state" XDG_CONFIG_HOME="$SMOKE/home/config" \
            CLAUDE_CONFIG_DIR="$SMOKE/claude" CODEX_HOME="$SMOKE/codex" \
            "$SMOKE/home/.local/bin/pod" --version)" = "$(cat VERSION)"
