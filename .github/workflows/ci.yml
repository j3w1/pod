name: Pod candidate checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

# One group per pull request or ref: a newer push replaces the pull-request run it
# superseded, and a push to main or a release tag is never canceled by anything.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  DISABLE_TELEMETRY: "1"
  DO_NOT_TRACK: "1"

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install build tooling
        run: python -m pip install --upgrade build PyYAML

      - name: Unit and incident suite
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: skills
      - name: Explicit incident discovery
        run: python -m unittest discover -s tests/incidents -t . -v
        env:
          PYTHONPATH: skills
      - name: Compile
        run: python -m compileall -q skills tests tools install.py

      - name: Validate the skill bundle
        run: python -m pod.skill_validation skills/pod
        env:
          PYTHONPATH: skills

      - name: Tracked source hygiene audit
        run: python tools/artifact_audit.py --source .

      - name: Build a frozen wheel and sdist from the Git tree
        run: |
          EXPORT="$(mktemp -d)"
          git archive HEAD | tar -x -C "$EXPORT"
          (cd "$EXPORT" && python -m build)
          mkdir -p dist
          cp "$EXPORT"/dist/* dist/
          echo "POD_EXPORT=$EXPORT" >> "$GITHUB_ENV"

      - name: Wheel matches the bundle
        run: python -m pod.skill_validation --wheel dist/*.whl
        env:
          PYTHONPATH: skills

      - name: Audit the built distributions
        run: python tools/artifact_audit.py dist/*

      - name: Install the wheel into an isolated environment
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/python -m pip install dist/*.whl
          for family in "" setup config doctor status; do
            .venv-smoke/bin/pod $family --help > /dev/null
          done
          HOMES="$(mktemp -d)"
          export HOME="$HOMES/home"
          export POD_CONFIG_HOME="$HOMES/pod-config"
          export POD_STATE_HOME="$HOMES/pod-state"
          export XDG_CONFIG_HOME="$HOMES/xdg-config"
          export XDG_STATE_HOME="$HOMES/xdg-state"
          export CODEX_HOME="$HOMES/codex"
          export CLAUDE_CONFIG_DIR="$HOMES/claude"
          mkdir -p "$HOME" "$POD_CONFIG_HOME" "$POD_STATE_HOME" "$XDG_CONFIG_HOME" \
            "$XDG_STATE_HOME" "$CODEX_HOME" "$CLAUDE_CONFIG_DIR"
          FIXTURE="$(mktemp -d)"
          POD_BIN="$PWD/.venv-smoke/bin/pod"
          (cd "$FIXTURE" && "$POD_BIN" setup --global --json)
          (cd "$FIXTURE" && "$POD_BIN" setup --json)
          (cd "$FIXTURE" && "$POD_BIN" config --check --json)
          (cd "$FIXTURE" && "$POD_BIN" doctor --json)
          PYTHONPATH=skills python -m pod.skill_validation --installed "$CODEX_HOME/skills/pod"
          echo "$HOMES" > "$RUNNER_TEMP/smoke-homes"

      - name: Explicit reviewed-checkout installer
        run: |
          python install.py --venv "$RUNNER_TEMP/installer-venv" --expected-commit "$GITHUB_SHA"
          "$RUNNER_TEMP/installer-venv/bin/pod" --help > /dev/null

      - name: The bundle runs as a plain copy, with no checkout
        run: |
          COPY="$RUNNER_TEMP/copy"
          mkdir -p "$COPY" "$RUNNER_TEMP/elsewhere" "$RUNNER_TEMP/copy-home"
          cp -r "$POD_EXPORT/skills/pod" "$COPY/pod"
          cd "$RUNNER_TEMP/elsewhere"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/copy-home" \
            python -I "$COPY/pod/scripts/pod.py" doctor --json > report.json
          python - <<'PY'
          import json, os, pathlib
          report = json.loads(pathlib.Path("report.json").read_text())
          expected = os.path.join(os.environ["RUNNER_TEMP"], "copy", "pod")
          assert report["bundle"]["path"].startswith(expected), report["bundle"]
          assert report["prerequisites"]["python"] == "ok", report["prerequisites"]
          PY

      - name: Install the skill with the community skills CLI
        run: |
          # The skills CLI honours CODEX_HOME, CLAUDE_CONFIG_DIR and XDG_STATE_HOME, so a
          # smoke that only overrides HOME writes into the real profile. Scrub them all.
          SMOKE="$RUNNER_TEMP/skills-home"
          mkdir -p "$SMOKE"
          env -u CODEX_HOME -u CLAUDE_CONFIG_DIR -u XDG_STATE_HOME -u XDG_CONFIG_HOME \
            HOME="$SMOKE" npx --yes skills@1.7.0 add "$POD_EXPORT" \
            --skill pod -a codex -a claude-code -g -y
          # A local-path source records no lock entry, so assert the shape the installer
          # actually produces: one canonical copy with every other agent linked at it.
          test -f "$SMOKE/.agents/skills/pod/SKILL.md"
          test -f "$SMOKE/.agents/skills/pod/scripts/pod.py"
          test -L "$SMOKE/.claude/skills/pod"
          test "$(readlink -f "$SMOKE/.claude/skills/pod")" = "$(readlink -f "$SMOKE/.agents/skills/pod")"
          PYTHONPATH=skills python -m pod.skill_validation --installed "$SMOKE/.agents/skills/pod"
          env -u CODEX_HOME -u CLAUDE_CONFIG_DIR HOME="$SMOKE" \
            python "$SMOKE/.claude/skills/pod/scripts/pod.py" doctor --json > /dev/null
          HOME="$SMOKE" CODEX_HOME="$SMOKE/.agents" CLAUDE_CONFIG_DIR="$SMOKE/.claude" \
            XDG_STATE_HOME="$SMOKE/.local/state" XDG_CONFIG_HOME="$SMOKE/.config" \
            .venv-smoke/bin/pod setup --global --json > setup.json
          python - <<'PY'
          import json, pathlib
          outcome = json.loads(pathlib.Path("setup.json").read_text())
          for host, value in outcome["skills"].items():
              assert value == "managed_by_skills_cli", (host, value)
          PY

  release:
    name: release
    if: github.ref_type == 'tag'
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install build tooling
        run: python -m pip install --upgrade build PyYAML

      - name: The tag names the package version
        run: |
          DECLARED="$(PYTHONPATH=skills python -c 'import pod; print(pod.__version__)')"
          test "${GITHUB_REF_NAME#v}" = "$DECLARED"

      - name: Build the release artifacts from the exact tag
        run: |
          EXPORT="$(mktemp -d)"
          git archive "$GITHUB_REF_NAME" | tar -x -C "$EXPORT"
          (cd "$EXPORT" && python -m build)
          mkdir -p dist
          cp "$EXPORT"/dist/* dist/
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix=pod/ \
            -o "dist/pod-skill-$VERSION.tar.gz" "$GITHUB_REF_NAME:skills/pod"
          python tools/artifact_audit.py dist/*
          (cd dist && sha256sum ./* > SHA256SUMS)

      - name: The published source installs as a skill
        run: |
          SMOKE="$RUNNER_TEMP/release-home"
          mkdir -p "$SMOKE"
          env -u CODEX_HOME -u CLAUDE_CONFIG_DIR -u XDG_STATE_HOME -u XDG_CONFIG_HOME \
            HOME="$SMOKE" npx --yes skills@1.7.0 add \
            "${GITHUB_REPOSITORY}#${GITHUB_REF_NAME}" --skill pod -a codex -a claude-code -g -y
          PYTHONPATH=skills python -m pod.skill_validation --installed "$SMOKE/.agents/skills/pod"
          # A remote source does record a lock entry, pinned to the tag that was installed.
          python - "$SMOKE/.agents/.skill-lock.json" "$GITHUB_REF_NAME" <<'PY'
          import json, sys
          lock = json.load(open(sys.argv[1]))
          entry = lock["skills"]["pod"]
          assert entry.get("ref") == sys.argv[2], entry
          print("lock entry pinned to", entry["ref"])
          PY

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          test -f "$NOTES"
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Pod $GITHUB_REF_NAME" --notes-file "$NOTES" dist/*
