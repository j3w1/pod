name: Pod candidate checks

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and build tooling
        run: python -m pip install --upgrade build PyYAML
      - name: Unit and incident suite
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Explicit incident discovery
        run: python -m unittest discover -s tests/incidents -t . -v
        env:
          PYTHONPATH: src
      - name: Compile
        run: python -m compileall -q src tests
      - name: Build frozen wheel from Git archive
        shell: bash
        run: |
          EXPORT="$(mktemp -d)"
          git archive HEAD | tar -x -C "$EXPORT"
          pushd "$EXPORT"
          python -m build --wheel
          popd
          mkdir -p dist
          cp "$EXPORT"/dist/*.whl dist/
      - name: Install wheel into isolated environment
        shell: bash
        run: |
          python -m venv .venv-smoke
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            .venv-smoke/Scripts/python -m pip install dist/*.whl
            .venv-smoke/Scripts/pod --help
            .venv-smoke/Scripts/pod config --check --json
            .venv-smoke/Scripts/pod doctor --json
            POD_BIN="$PWD/.venv-smoke/Scripts/pod"
          else
            .venv-smoke/bin/python -m pip install dist/*.whl
            .venv-smoke/bin/pod --help
            .venv-smoke/bin/pod config --check --json
            .venv-smoke/bin/pod doctor --json
            POD_BIN="$PWD/.venv-smoke/bin/pod"
          fi
          FIXTURE="$(mktemp -d)"
          (cd "$FIXTURE" && "$POD_BIN" setup --json)
