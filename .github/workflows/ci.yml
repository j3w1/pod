name: Pod checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# One group per pull request or ref: a newer push replaces the pull-request run it
# superseded, and a push to main is never canceled by anything.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  DISABLE_TELEMETRY: "1"
  DO_NOT_TRACK: "1"

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install PyYAML, the one runtime prerequisite
        run: python -m pip install 'PyYAML>=6.0.2,<7'

      - name: Unit and incident suite
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: skills
      - name: Explicit incident discovery
        run: python -m unittest discover -s tests/incidents -t . -v
        env:
          PYTHONPATH: skills
      - name: Compile
        run: python -m compileall -q skills tests tools
      - name: Whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Validate the skill bundle and its budgets
        run: python -m pod.skill_validation skills/pod
        env:
          PYTHONPATH: skills

      - name: Tracked source hygiene audit
        run: python tools/source_audit.py .

      - name: The bundle runs as a plain copy, with no checkout
        run: |
          COPY="$RUNNER_TEMP/copy"
          mkdir -p "$COPY" "$RUNNER_TEMP/elsewhere" "$RUNNER_TEMP/copy-home"
          cp -rL skills/pod "$COPY/pod"
          cd "$RUNNER_TEMP/elsewhere"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/copy-home" \
            python -I "$COPY/pod/scripts/pod.py" doctor --json > report.json
          python - "$GITHUB_WORKSPACE/VERSION" <<'PY'
          import json, os, pathlib, sys
          report = json.loads(pathlib.Path("report.json").read_text())
          expected = os.path.join(os.environ["RUNNER_TEMP"], "copy", "pod")
          assert report["bundle"]["path"].startswith(expected), report["bundle"]
          assert report["bundle"]["version"] == pathlib.Path(sys.argv[1]).read_text().strip(), report["bundle"]
          assert report["prerequisites"]["python"] == "ok", report["prerequisites"]
          PY

      - name: Install this commit with the skills CLI and run its helpers
        run: |
          # The skills CLI honours CODEX_HOME, CLAUDE_CONFIG_DIR and XDG_STATE_HOME, so a
          # smoke that only overrides HOME writes into the real profile. Scrub them all.
          SMOKE="$RUNNER_TEMP/skills-home"
          mkdir -p "$SMOKE"
          env -u CODEX_HOME -u CLAUDE_CONFIG_DIR -u XDG_STATE_HOME -u XDG_CONFIG_HOME \
            HOME="$SMOKE" npx --yes skills@1.7.0 add "$GITHUB_WORKSPACE" \
            --skill pod -a codex -a claude-code -g -y
          # One canonical copy with every other agent linked at it.
          test -f "$SMOKE/.agents/skills/pod/SKILL.md"
          test -f "$SMOKE/.agents/skills/pod/VERSION" && ! test -L "$SMOKE/.agents/skills/pod/VERSION"
          test -L "$SMOKE/.claude/skills/pod"
          test "$(readlink -f "$SMOKE/.claude/skills/pod")" = "$(readlink -f "$SMOKE/.agents/skills/pod")"
          PYTHONPATH=skills python -m pod.skill_validation --installed "$SMOKE/.agents/skills/pod"
          POD="$SMOKE/.agents/skills/pod/scripts/pod.py"
          export HOME="$SMOKE" CODEX_HOME="$SMOKE/.agents" CLAUDE_CONFIG_DIR="$SMOKE/.claude" \
            XDG_STATE_HOME="$SMOKE/.local/state" XDG_CONFIG_HOME="$SMOKE/.config"
          for family in "" setup config doctor status; do
            python "$POD" $family --help > /dev/null
          done
          PROJECT="$(mktemp -d)"
          git -C "$PROJECT" init -q
          (cd "$PROJECT" && python "$POD" setup --global --json > "$RUNNER_TEMP/setup.json")
          (cd "$PROJECT" && python "$POD" config --check --json > /dev/null)
          (cd "$PROJECT" && python "$POD" doctor --json > "$RUNNER_TEMP/doctor.json")
          python - "$RUNNER_TEMP/setup.json" "$RUNNER_TEMP/doctor.json" "$GITHUB_WORKSPACE/VERSION" <<'PY'
          import json, pathlib, sys
          setup = json.loads(pathlib.Path(sys.argv[1]).read_text())
          for host, value in setup["skills"].items():
              assert value == "managed_by_skills_cli", (host, value)
          doctor = json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert doctor["bundle"]["version"] == pathlib.Path(sys.argv[3]).read_text().strip(), doctor["bundle"]
          PY

      - name: Install j3w1/pod itself the documented way
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          SMOKE="$RUNNER_TEMP/remote-home"
          mkdir -p "$SMOKE"
          SOURCE="${GITHUB_REPOSITORY}"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then SOURCE="${GITHUB_REPOSITORY}#${GITHUB_HEAD_REF}"; fi
          env -u CODEX_HOME -u CLAUDE_CONFIG_DIR -u XDG_STATE_HOME -u XDG_CONFIG_HOME \
            HOME="$SMOKE" npx --yes skills@1.7.0 add "$SOURCE" --skill pod -a codex -a claude-code -g -y
          PYTHONPATH=skills python -m pod.skill_validation --installed "$SMOKE/.agents/skills/pod"
          env -i PATH="$PATH" HOME="$SMOKE" python -I "$SMOKE/.agents/skills/pod/scripts/pod.py" doctor --json > /dev/null
