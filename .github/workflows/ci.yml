name: Pod checks

# Every run is a full run: pull requests, main pushes, the weekly run (which catches a new
# CPython or runner image on an unchanged main) and a hand dispatch all run the same three
# jobs; `linux` is the required check.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONPATH: skills
  DISABLE_TELEMETRY: "1"
  DO_NOT_TRACK: "1"

jobs:
  python:
    # Resolve the latest stable CPython once; every job runs exactly this version.
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.setup.outputs.python-version }}
    steps:
      - id: setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          check-latest: true
          allow-prereleases: false
      - run: python --version

  core:
    name: core
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.python.outputs.version }}
      - name: The resolved interpreter is the one running
        run: test "$(python -c 'import platform; print(platform.python_version())')" = "${{ needs.python.outputs.version }}"
      - name: Core tests, with an empty home
        run: mkdir -p "$RUNNER_TEMP/home" && HOME="$RUNNER_TEMP/home" python -m unittest discover -s tests/core -t .

  models:
    name: models
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.python.outputs.version }}
      - name: The resolved interpreter is the one running
        run: test "$(python -c 'import platform; print(platform.python_version())')" = "${{ needs.python.outputs.version }}"
      - name: Model registry, refresh and workspace tests, with an empty home
        run: mkdir -p "$RUNNER_TEMP/home" && HOME="$RUNNER_TEMP/home" python -m unittest discover -s tests/models -t .

  install:
    name: install
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.python.outputs.version }}
      - name: The resolved interpreter is the one running
        run: test "$(python -c 'import platform; print(platform.python_version())')" = "${{ needs.python.outputs.version }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install zsh for shell tests
        run: sudo apt-get update -qq && sudo apt-get install -y zsh
      - name: Static checks
        run: |
          python tools/source_audit.py
          python -m pod.skill_validation
          python -m compileall -q skills tests tools
        env:
          PYTHONDONTWRITEBYTECODE: "0"
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
      - name: Installer trials, with an empty home
        run: mkdir -p "$RUNNER_TEMP/home" && HOME="$RUNNER_TEMP/home" python -m unittest discover -s tests/install -t .
      - name: Install this commit from an archive in a clean home, through the real skills CLI
        run: |
          git archive --format=tar.gz --prefix=pod-source/ HEAD > "$RUNNER_TEMP/pod-source.tar.gz"
          SMOKE="$RUNNER_TEMP/install-home"
          mkdir -p "$SMOKE/home" "$SMOKE/claude" "$SMOKE/codex"
          clean() {
            env -i PATH="$PATH" HOME="$SMOKE/home" XDG_DATA_HOME="$SMOKE/home/data" XDG_STATE_HOME="$SMOKE/home/state" \
              XDG_CONFIG_HOME="$SMOKE/home/config" XDG_CACHE_HOME="$SMOKE/home/cache" CLAUDE_CONFIG_DIR="$SMOKE/claude" \
              CODEX_HOME="$SMOKE/codex" SHELL=/bin/bash "$@"
          }
          clean POD_INSTALL_SOURCE="file://$RUNNER_TEMP/pod-source.tar.gz" sh install.sh
          python -m pod.skill_validation --installed "$SMOKE/home/.agents/skills/pod"
          clean "$SMOKE/home/.local/bin/pod" --version | diff - VERSION
          clean "$SMOKE/home/.local/bin/pod" config --json
          clean "$SMOKE/home/.local/bin/pod" doctor --json
          clean "$SMOKE/home/.local/bin/pod" models --plain | head -n 5
          clean "$SMOKE/home/.local/bin/pod" status --all --json

  linux:
    # The one required check: it is green only when every job above passed on this head.
    name: linux
    needs: [python, core, models, install]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        run: |
          test "${{ needs.python.result }}" = success
          test "${{ needs.core.result }}" = success
          test "${{ needs.models.result }}" = success
          test "${{ needs.install.result }}" = success
