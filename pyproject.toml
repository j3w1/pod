[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "j3w1-pod"
dynamic = ["version"]
description = "A skill-first coordination policy for Orca"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "j3w1" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
]
dependencies = ["PyYAML>=6.0.2,<7"]

[project.urls]
Homepage = "https://github.com/j3w1/pod"
Repository = "https://github.com/j3w1/pod"
Issues = "https://github.com/j3w1/pod/issues"
Releases = "https://github.com/j3w1/pod/releases"

[project.scripts]
pod = "pod.cli:main"

[tool.setuptools]
packages = ["pod"]
package-dir = { pod = "skills/pod" }

[tool.setuptools.dynamic]
version = { attr = "pod.__version__" }

[tool.setuptools.package-data]
pod = ["SKILL.md", "agents/openai.yaml", "scripts/pod.py", "references/*.md"]
